name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

# Least privilege by default; the jobs that comment on a PR ask for more themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.decide.outputs.run_ci }}
      run_browser: ${{ steps.decide.outputs.run_browser }}
      run_renovate: ${{ steps.decide.outputs.run_renovate }}
      run_mutation: ${{ steps.decide.outputs.run_mutation }}
      run_review: ${{ steps.decide.outputs.run_review }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Decide whether to run CI
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
            echo "run_browser=false" >> "$GITHUB_OUTPUT"
            echo "run_renovate=false" >> "$GITHUB_OUTPUT"
            echo "run_mutation=true" >> "$GITHUB_OUTPUT"
            echo "run_review=false" >> "$GITHUB_OUTPUT"
            echo "Nightly: mutation only"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD)"
            decision="$(printf '%s\n' "$files" | node scripts/should-run-ci.mjs)"
            browser="$(printf '%s\n' "$files" | node scripts/should-run-browser.mjs)"
          else
            files="$(git diff --name-only HEAD~1 HEAD || true)"
            decision="true"
            browser="true"
            echo "Push to main: run CI"
          fi
          renovate="$(printf '%s\n' "$files" | node scripts/should-run-renovate.mjs)"
          mutation="$(printf '%s\n' "$files" | node scripts/should-run-mutation.mjs)"
          review="$(printf '%s\n' "$files" | node scripts/should-run-review.mjs)"
          echo "run_ci=$decision" >> "$GITHUB_OUTPUT"
          echo "run_browser=$browser" >> "$GITHUB_OUTPUT"
          echo "run_renovate=$renovate" >> "$GITHUB_OUTPUT"
          echo "run_mutation=$mutation" >> "$GITHUB_OUTPUT"
          echo "run_review=$review" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          printf '%s\n' "$files"
          echo "Run CI: $decision"
          echo "Run browser suites: $browser"
          echo "Run Renovate validator: $renovate"
          echo "Run mutation: $mutation"
          echo "Run test review: $review"

  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read installed Playwright version
        id: version
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright image tag v${version}-noble"

  test:
    name: Playwright (${{ matrix.suite }})
    needs: [changes, playwright-version]
    # Skipped when only docs or ai/ tooling changed (scripts/should-run-browser.mjs).
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.run_browser == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, e2e, api, visual]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix app

      - name: Run ${{ matrix.suite }} tests
        run: npm run test:${{ matrix.suite }}
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          # Tight enough that a real visual change (a new header colour) fails; see playwright.config.ts.
          VISUAL_MAX_DIFF_RATIO: '0.02'

      # Only here do the failed tests' folders (error-context.md with the page snapshot) exist.
      # Writes test-results/locator-hints.json; the summary job shows them in the PR comment.
      - name: Collect locator suggestions
        if: failure()
        continue-on-error: true
        run: npm run analyze:locators

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-json-${{ matrix.suite }}
          path: |
            test-results/playwright-results.json
            test-results/locator-hints.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.suite }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-results-${{ matrix.suite }}
          path: test-results/
          retention-days: 14

  test-review:
    name: Test convention review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.run_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The review runs the base branch's code and conventions, never the PR's: this step has a
      # secret, and a pull request could otherwise change the reviewer (or its rules) that judges it.
      - name: Checkout trusted tooling (base branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Install dependencies (base branch)
        working-directory: trusted
        run: npm ci --ignore-scripts

      - name: Review the test diff
        working-directory: trusted
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          git -C "$GITHUB_WORKSPACE" diff --unified=3 ${{ github.event.pull_request.base.sha }} HEAD -- tests > /tmp/tests.diff
          npm run analyze:review -- --diff /tmp/tests.diff --out "$GITHUB_WORKSPACE/ai-reports/pr-review.md"

      - name: Upload test review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-review
          path: ai-reports/pr-review.md
          if-no-files-found: error
          retention-days: 14

  run-summary:
    name: AI run summary (PR)
    needs: [changes, test, test-review]
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.run_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Download suite JSON artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: playwright-json-*
          path: artifacts
          merge-multiple: false

      - name: Download test review
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pr-review
          path: ai-reports

      - name: Build Markdown summary
        id: summary
        env:
          SUMMARY_TITLE: Playwright CI summary
          SUMMARY_OUT: ai-reports/run-summary.md
        run: |
          chmod +x ai/run-summary/ci-collect.sh
          set +e
          ai/run-summary/ci-collect.sh artifacts
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          echo "summary_exit=$code" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER='<!-- playwright-ai-run-summary -->'
          {
            echo "$MARKER"
            echo
            cat ai-reports/run-summary.md
            if [ -f ai-reports/pr-review.md ]; then
              echo
              cat ai-reports/pr-review.md
            fi
          } > /tmp/pr-run-summary.md

          PR_NUMBER='${{ github.event.pull_request.number }}'
          REPO='${{ github.repository }}'

          EXISTING="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1 || true)"

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING}" -F body=@/tmp/pr-run-summary.md
            echo "Updated existing summary comment ${EXISTING}"
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/pr-run-summary.md
            echo "Posted new summary comment"
          fi

  ai-unit:
    name: AI Failure Analyzer unit tests
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix app

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix app

      # Fails on Playwright tests that can pass without checking anything (no assertion,
      # un-awaited web-first assertion, assertion inside an if) and on test.only / fixed waits.
      - name: Lint Playwright tests
        run: npm run lint:tests

      - name: Run analyzer unit tests
        run: npm run test:ai

      # Type-checks the app (and its Node unit tests) and builds it. The browser suites run the
      # dev server, which doesn't type-check, so without this a broken build went unnoticed.
      - name: Build the app
        run: npm run build

  dep-gate:
    name: New dependency gate
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch PR base
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      # No npm ci here: the gate uses only Node built-ins, so nothing from the PR's
      # dependency list is downloaded before the gate has judged it.
      - name: Check new dependencies
        run: npm run analyze:deps -- --base ${{ github.event.pull_request.base.sha }}

  renovate-config:
    name: Renovate config
    needs: changes
    if: needs.changes.outputs.run_renovate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Validate renovate.json
        run: npx --yes --package renovate@44.221.5 renovate-config-validator

  mutation:
    name: Mutation testing
    needs: changes
    if: needs.changes.outputs.run_mutation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Stryker's incremental file remembers each mutant's result, so only mutants in changed
      # code or tests run again. A pull request starts from its own last run, else from main's.
      - name: Restore Stryker incremental results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ github.ref }}-
            stryker-incremental-refs/heads/main-

      # The nightly run ignores the saved results (--force) and tests every mutant again.
      - name: Run mutation tests
        run: npm run test:mutation -- ${{ github.event_name == 'schedule' && '--force' || '' }}

      - name: Save Stryker incremental results
        if: always() && hashFiles('reports/stryker-incremental.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref }}-${{ github.run_id }}

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 14

  ai-provenance:
    name: AI provenance
    needs: [changes, mutation]
    # Every pull request, including ones where mutation testing was skipped (no ai/ change).
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download mutation report
        if: needs.mutation.result == 'success' || needs.mutation.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mutation-report
          path: reports/mutation

      - name: Find mutation report
        id: mutation
        run: |
          if [ -f reports/mutation/mutation.json ]; then
            echo "path=reports/mutation/mutation.json" >> "$GITHUB_OUTPUT"
          fi

      # Pinned to the v1.0.0 commit; Renovate proposes updates.
      - name: AI provenance audit
        uses: ksycz/ai-provenance-action@ef4ec03304e53edc512f889ac4a996f93f3c6680 # v1.0.0
        with:
          mutation-report: ${{ steps.mutation.outputs.path }}
          pr-comment: 'true'

  # The one check `main` requires before a merge (ruleset "main protection"). It passes when every
  # job above succeeded or was skipped on purpose, and fails if any failed or was cancelled.
  ci-result:
    name: CI result
    if: always()
    needs:
      - changes
      - playwright-version
      - test
      - test-review
      - run-summary
      - ai-unit
      - dep-gate
      - renovate-config
      - mutation
      - ai-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-result.mjs
          sparse-checkout-cone-mode: false

      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-result.mjs
