name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.decide.outputs.run_ci }}
      run_renovate: ${{ steps.decide.outputs.run_renovate }}
      run_review: ${{ steps.decide.outputs.run_review }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether to run CI
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD)"
            decision="$(printf '%s\n' "$files" | node scripts/should-run-ci.mjs)"
          else
            files="$(git diff --name-only HEAD~1 HEAD || true)"
            decision="true"
            echo "Push to main: run CI"
          fi
          renovate="$(printf '%s\n' "$files" | node scripts/should-run-renovate.mjs)"
          review="$(printf '%s\n' "$files" | node scripts/should-run-review.mjs)"
          echo "run_ci=$decision" >> "$GITHUB_OUTPUT"
          echo "run_renovate=$renovate" >> "$GITHUB_OUTPUT"
          echo "run_review=$review" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          printf '%s\n' "$files"
          echo "Run CI: $decision"
          echo "Run Renovate validator: $renovate"
          echo "Run test review: $review"

  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read installed Playwright version
        id: version
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright image tag v${version}-noble"

  test:
    name: Playwright (${{ matrix.suite }})
    needs: [changes, playwright-version]
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, e2e, api, visual]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app

      - name: Run ${{ matrix.suite }} tests
        run: npm run test:${{ matrix.suite }}
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-json-${{ matrix.suite }}
          path: test-results/playwright-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ matrix.suite }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results-${{ matrix.suite }}
          path: test-results/
          retention-days: 14

  test-review:
    name: Test convention review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.run_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Review the test diff
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          git diff --unified=3 ${{ github.event.pull_request.base.sha }} HEAD -- tests > /tmp/tests.diff
          npm run analyze:review -- --diff /tmp/tests.diff --out ai-reports/pr-review.md

      - name: Upload test review
        uses: actions/upload-artifact@v5
        with:
          name: pr-review
          path: ai-reports/pr-review.md
          if-no-files-found: error
          retention-days: 14

  run-summary:
    name: AI run summary (PR)
    needs: [changes, test, test-review]
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Download suite JSON artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: playwright-json-*
          path: artifacts
          merge-multiple: false

      - name: Download test review
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: pr-review
          path: ai-reports

      - name: Build Markdown summary
        id: summary
        env:
          SUMMARY_TITLE: Playwright CI summary
          SUMMARY_OUT: ai-reports/run-summary.md
        run: |
          chmod +x ai/run-summary/ci-collect.sh
          set +e
          ai/run-summary/ci-collect.sh artifacts
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          echo "summary_exit=$code" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER='<!-- playwright-ai-run-summary -->'
          {
            echo "$MARKER"
            echo
            cat ai-reports/run-summary.md
            if [ -f ai-reports/pr-review.md ]; then
              echo
              cat ai-reports/pr-review.md
            fi
          } > /tmp/pr-run-summary.md

          PR_NUMBER='${{ github.event.pull_request.number }}'
          REPO='${{ github.repository }}'

          EXISTING="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1 || true)"

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING}" -F body=@/tmp/pr-run-summary.md
            echo "Updated existing summary comment ${EXISTING}"
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/pr-run-summary.md
            echo "Posted new summary comment"
          fi

  ai-unit:
    name: AI Failure Analyzer unit tests
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix app

      - name: Run analyzer unit tests
        run: npm run test:ai

  dep-gate:
    name: New dependency gate
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch PR base
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check new dependencies
        run: npm run analyze:deps -- --base ${{ github.event.pull_request.base.sha }}

  renovate-config:
    name: Renovate config
    needs: changes
    if: needs.changes.outputs.run_renovate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate renovate.json
        run: npx --yes --package renovate@44.221.5 renovate-config-validator
