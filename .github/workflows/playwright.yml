name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Playwright (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, e2e, api, visual]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app
          npm run playwright:install

      - name: Install Playwright system dependencies
        run: PLAYWRIGHT_BROWSERS_PATH=.playwright-browsers npx playwright install-deps chromium

      - name: Run ${{ matrix.suite }} tests
        run: npm run test:${{ matrix.suite }}
        env:
          CI: true

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-json-${{ matrix.suite }}
          path: test-results/playwright-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ matrix.suite }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results-${{ matrix.suite }}
          path: test-results/
          retention-days: 14

  run-summary:
    name: AI run summary (PR)
    needs: test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Download suite JSON artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: playwright-json-*
          path: artifacts
          merge-multiple: false

      - name: Build Markdown summary
        id: summary
        env:
          SUMMARY_TITLE: Playwright CI summary
          SUMMARY_OUT: ai-reports/run-summary.md
        run: |
          chmod +x ai/run-summary/ci-collect.sh
          set +e
          ai/run-summary/ci-collect.sh artifacts
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            exit 1
          fi
          echo "summary_exit=$code" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER='<!-- playwright-ai-run-summary -->'
          {
            echo "$MARKER"
            echo
            cat ai-reports/run-summary.md
          } > /tmp/pr-run-summary.md

          PR_NUMBER='${{ github.event.pull_request.number }}'
          REPO='${{ github.repository }}'

          EXISTING="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1 || true)"

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING}" -F body=@/tmp/pr-run-summary.md
            echo "Updated existing summary comment ${EXISTING}"
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/pr-run-summary.md
            echo "Posted new summary comment"
          fi

  ai-unit:
    name: AI Failure Analyzer unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix app

      - name: Run analyzer unit tests
        run: npm run test:ai

  dep-gate:
    name: New dependency gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix app

      - name: Fetch PR base
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}

      - name: Check new dependencies
        run: npm run analyze:deps -- --base ${{ github.event.pull_request.base.sha }}
